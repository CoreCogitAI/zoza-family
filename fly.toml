# Fly.io: one always-on machine in Singapore. State (invites, inbox) lives on a volume.
app = "zoza-family"
primary_region = "sin"

[build]

[env]
  PORT = "8790"
  HOST = "0.0.0.0"

[mounts]
  source = "zoza_family_data"
  destination = "/app/server/data"

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
